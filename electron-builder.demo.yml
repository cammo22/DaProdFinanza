# Versione dimostrativa: un eseguibile portable che parte già con la Pizzeria
# DaProd e i suoi bilanci caricati, da far provare senza dover preparare dati.
#
# Si costruisce solo con `npm run dist:demo`, che accende il flag di build
# __DEMO_BUILD__. Nome, identificativo e cartella dati sono diversi da quelli
# dell'app vera: le due possono convivere sulla stessa macchina senza toccarsi.
extends: electron-builder.yml

appId: com.daprodproduzioni.daprodfinanza.demo
productName: DaProdFinanza Demo

directories:
  buildResources: build
  output: release/demo

win:
  icon: build/icon.ico
  target:
    - target: portable
      arch: [x64]

portable:
  artifactName: DaProdFinanza-Demo-${version}-portable.${ext}

# --- Mac: solo la demo, come DMG ------------------------------------------------
# Si costruisce su un Mac vero, dalla procedura .github/workflows/mac-demo.yml:
# il modulo nativo del database va compilato per macOS, e da Windows non si può.
# Niente certificato Apple: firma "ad-hoc" (obbligatoria sui Mac con chip Apple)
# e nessuna notarizzazione, quindi al primo avvio macOS chiede conferma.
mac:
  icon: build/icon.png
  category: public.app-category.finance
  target:
    - target: dmg
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: DaProdFinanza-Demo-${version}-mac-${arch}.${ext}
  title: DaProdFinanza Demo ${version}
