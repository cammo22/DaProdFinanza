name: Demo per Mac

# La demo per Mac (DMG) si costruisce su un Mac di GitHub: il modulo nativo del
# database cifrato va compilato per macOS. Parte da sola quando si pubblica una
# release e aggiunge i DMG (Apple Silicon e Intel) ai file della release; si può
# anche lanciare a mano indicando il tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag della release (es. v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Controllo dei tipi e test
        run: |
          npm run typecheck
          npm run test

      - name: Build della demo
        run: npx electron-vite build
        env:
          DAPROD_DEMO_BUILD: '1'

      - name: DMG per Apple Silicon e Intel
        run: npx electron-builder --mac dmg --arm64 --x64 --config electron-builder.demo.yml --publish never
        env:
          DAPROD_DEMO_BUILD: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Aggiunge i DMG alla release
        run: gh release upload "$TAG" release/demo/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
