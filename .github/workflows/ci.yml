name: CI

on:
  push:
    branches: [main]
  pull_request:

# Target di prodotto è Windows (AGENTS.md §2): la CI gira lì per intercettare
# subito problemi di build del modulo nativo cifrato, non solo di TypeScript.
jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Controllo dei tipi
        run: npm run typecheck

      # Le prove del motore di calcolo (formule, cassa, finanziamenti, impostazioni):
      # prima giravano solo in locale dentro `npm run build`.
      - name: Test
        run: npm run test

      - name: Build (main + preload + renderer)
        run: npx electron-vite build

      - name: Build della versione Android (solo la parte web)
        run: npm run android:web
